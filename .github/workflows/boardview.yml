# Builds the boardview (HTML viewer + OpenBoardView .brd) with dpetzel/kicad-boardview; settings in boardview.toml.
#   pull request  -> files attached to the run as the "boardview" artifact, for review
#   push to main  -> deployed to GitHub Pages
name: boardview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: boardview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boardview:
    uses: dpetzel/kicad-boardview/.github/workflows/boardview.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
