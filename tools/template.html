<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boardview</title>
<style>
:root{--bg:#14171a;--panel:#1d2227;--fg:#e6e9ec;--mut:#8b96a0;--acc:#3fb6ff;--pad:#ffd24a;--sel:#ff3b3b;--trk:#ff9f43;--edge:#9be08a;--unk:#ff7a59}
@media (prefers-color-scheme:light){:root{--bg:#e9ecef;--panel:#fff;--fg:#1c2126;--mut:#5b6670;--acc:#0a6fd1;--pad:#b07a00;--sel:#d90429;--trk:#d9480f;--edge:#2b8a3e;--unk:#d9480f}}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
#bar{position:fixed;top:0;left:0;right:0;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--panel);z-index:2;border-bottom:1px solid #0003}
input[type=text]{padding:6px 8px;border-radius:6px;border:1px solid #8884;background:var(--bg);color:var(--fg);width:210px;max-width:100%}
label{display:flex;gap:6px;align-items:center;color:var(--mut)}
.seg{display:inline-flex;border:1px solid #8886;border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--fg);padding:5px 12px;cursor:pointer;font:inherit}
.seg button.on{background:var(--acc);color:#fff}
#c{position:absolute;top:0;left:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#info{position:fixed;left:12px;bottom:12px;background:var(--panel);padding:10px 12px;border-radius:8px;min-width:min(240px,calc(100vw - 48px));max-width:min(360px,calc(100vw - 48px));max-height:45vh;overflow:auto;font-size:13px;line-height:1.5;box-shadow:0 2px 8px #0004}
#info b{color:var(--acc)} #info .m{color:var(--mut)} #info a{color:var(--acc)}
#info .hd{display:flex;align-items:center;gap:8px}
#info .ttl{font-size:16px;font-weight:600;color:var(--acc);overflow-wrap:anywhere}
#info .x{margin-left:auto;border:0;background:none;color:var(--mut);font-size:20px;line-height:1;padding:0 2px;cursor:pointer}
#info .x:hover{color:var(--fg)}
#info .tag{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--unk);color:var(--unk);white-space:nowrap}
#info .sub{margin:1px 0 0;overflow-wrap:anywhere}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0}
#info dt{color:var(--mut)} #info dd{margin:0;overflow-wrap:anywhere}
#info details{margin-top:8px;border-top:1px solid #8883;padding-top:6px}
#info summary{cursor:pointer;color:var(--mut)}
#info .grid{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin-top:4px;font-size:12px}
#info .grid>:nth-child(odd){font-family:ui-monospace,monospace;color:var(--mut)}
#info .lnk{border:0;background:none;padding:0;font:inherit;color:var(--acc);cursor:pointer;text-align:left}
#info .lnk:hover{text-decoration:underline}
#info .ft{margin-top:8px;color:var(--mut);font-size:12px}
#hint{position:fixed;right:12px;bottom:12px;color:var(--mut);font-size:12px}
@media (max-width:700px){#hint{display:none}}
</style></head><body>
<div id="bar"><b id="ttl">Boardview</b>
<span class="seg"><button id="sF" class="on">Top</button><button id="sB">Bottom</button></span>
<input id="q" type="text" placeholder="Search ref, value or net…" autocomplete="off">
<span id="photoctl" style="display:flex;gap:10px"><label><input type="checkbox" id="photo"> photo</label><label>opacity <input type="range" id="op" min="0" max="100" value="85"></label></span>
<label><input type="checkbox" id="pads" checked> pads</label>
<label><input type="checkbox" id="outl" checked> outlines</label>
<label><input type="checkbox" id="labs"> labels</label>
<label><input type="checkbox" id="trk" checked> copper</label>
<label><input type="checkbox" id="other"> other side</label>
<label><input type="checkbox" id="mir" checked> mirror bottom</label>
<label><input type="checkbox" id="unk"> highlight unidentified (REF**, R?)</label>
<span id="cnt" style="color:var(--mut)"></span></div>
<canvas id="c"></canvas><div id="info"></div>
<div id="hint">scroll / pinch = zoom · drag = pan · double-click = fit · F = flip side</div>
<script>
/*DATA*/
const {parts:PARTS,tracks:TRACKS,vias:VIAS,zones:ZONES,outline:OUTLINE,photos:PHOTOS}=BV;
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),DPR=()=>devicePixelRatio||1;
document.title=BV.title+' boardview';$('ttl').textContent=BV.title+' boardview';
const IMGS={};for(const s in PHOTOS){IMGS[s]=new Image();IMGS[s].onload=()=>draw();IMGS[s].src=PHOTOS[s].src;}
if(!Object.keys(PHOTOS).length)$('photoctl').remove();
if(!PHOTOS.B&&!PARTS.some(p=>p.side==='B'))$('sB').parentNode.remove();
const NETS={};for(const p of PARTS)for(const q of p.pads)if(q[7])(NETS[q[7]]=NETS[q[7]]||[]).push(p.ref+'.'+q[0]);
const NETNAMES=Object.keys(NETS).sort();
let side='F',sc=3,ox=0,oy=0,sel=null,hits=new Set(),selNet=null,selVia=null;
const unident=p=>/(\*\*|\?)$/.test(p.ref);
const mir=()=>side==='B'&&$('mir').checked?-1:1;
const S=(x,y)=>[mir()*x*sc+ox,y*sc+oy];
const W=(X,Y)=>[(X-ox)/sc*mir(),(Y-oy)/sc];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isUrl=s=>/^https?:\/\/\S+$/i.test(s);
const fval=v=>isUrl(v)?'<a href="'+esc(v)+'" target="_blank" rel="noopener" title="'+esc(v)+'">'+esc(v.replace(/^https?:\/\/(www\.)?/i,'').split(/[/?#]/)[0])+'</a>':esc(v);
const srcN=k=>+k.slice(6)||1;   // Source, Source2, Source3 ... -> 1, 2, 3
function size(){cv.width=innerWidth*DPR();cv.height=innerHeight*DPR();}
function bounds(){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const add=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);};
 for(const o of OUTLINE)for(const p of o)add(p[0],p[1]);const P=PHOTOS[side];if(P&&$('photo').checked){add(P.x,P.y);add(P.x+P.w,P.y+P.h);}
 if(x0>x1)for(const p of PARTS){add(p.bbox[0],p.bbox[1]);add(p.bbox[2],p.bbox[3]);}return[x0,y0,x1,y1];}
function fit(){const[x0,y0,x1,y1]=bounds(),top=$('bar').offsetHeight*DPR()+8;
 sc=Math.min(cv.width/(x1-x0),(cv.height-top)/(y1-y0))*0.95;
 const left=(cv.width-(x1-x0)*sc)/2;ox=mir()<0?left+x1*sc:left-x0*sc;oy=top+(cv.height-top-(y1-y0)*sc)/2-y0*sc;}
function path(pts){ctx.beginPath();pts.forEach((p,i)=>{const[X,Y]=S(p[0],p[1]);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.closePath();}
function drawPart(p,faint){const ACC=css('--acc'),PAD=css('--pad'),SEL=css('--sel'),UNK=css('--unk'),hit=hits.has(p),isSel=p===sel,m=mir(),un=$('unk').checked&&unident(p);
 if(faint){ctx.globalAlpha=.3;}
 if($('outl').checked||hit||isSel||un){const a=S(p.bbox[0],p.bbox[1]),b=S(p.bbox[2],p.bbox[3]);
  ctx.lineWidth=(isSel||hit||un?2.5:1)*DPR();ctx.strokeStyle=isSel||hit?SEL:un?UNK:ACC;if(!faint)ctx.globalAlpha=isSel||hit||un?1:.6;
  ctx.strokeRect(Math.min(a[0],b[0]),a[1],Math.abs(b[0]-a[0]),b[1]-a[1]);if(!faint)ctx.globalAlpha=1;}
 if($('pads').checked&&!faint)for(const q of p.pads){const[X,Y]=S(q[2],q[3]),w=q[4]*sc,h=q[5]*sc,on=selNet&&q[7]===selNet;
  ctx.save();ctx.translate(X,Y);ctx.rotate(-m*q[6]*Math.PI/180);
  ctx.strokeStyle=on?SEL:PAD;ctx.lineWidth=(on?2:1)*DPR();ctx.fillStyle=on?SEL+'aa':isSel||hit?SEL+'77':q[7]?PAD+'66':PAD+'26';
  if(q[1]==='circle'||(q[1]==='oval'&&Math.abs(q[4]-q[5])<1e-3)){ctx.beginPath();ctx.arc(0,0,w/2,0,7);ctx.fill();ctx.stroke();}
  else if(q[1]==='oval'){const r=Math.min(w,h)/2;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,r);ctx.fill();ctx.stroke();}
  else{ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeRect(-w/2,-h/2,w,h);}ctx.restore();}
 if(!faint&&(($('labs').checked&&sc/DPR()>7)||hit||isSel)){const[X,Y]=S(p.x,p.y),fs=Math.max(10,Math.min(15,sc/DPR()*0.8))*DPR();
  ctx.font=fs+'px system-ui';ctx.fillStyle=isSel||hit?SEL:'#fff';ctx.strokeStyle='#000';ctx.lineWidth=3*DPR();ctx.strokeText(p.ref,X+4,Y-4);ctx.fillText(p.ref,X+4,Y-4);}
 ctx.globalAlpha=1;}
function draw(){const SEL=css('--sel'),TRK=css('--trk'),EDGE=css('--edge'),ACC=css('--acc');
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
 const P=PHOTOS[side],I=IMGS[side];
 if(P&&$('photo').checked&&I&&I.complete&&I.naturalWidth){ctx.save();ctx.globalAlpha=$('op').value/100;ctx.translate(ox,oy);ctx.scale(mir()*sc,sc);ctx.drawImage(I,P.x,P.y,P.w,P.h);ctx.restore();}
 if($('trk').checked){
  for(const z of ZONES){if(!z.sides.includes(side))continue;const on=selNet&&z.net===selNet;path(z.poly);
   ctx.fillStyle=on?SEL+'40':ACC+'18';ctx.fill();ctx.strokeStyle=on?SEL:ACC+'88';ctx.setLineDash([6*DPR(),4*DPR()]);ctx.lineWidth=DPR();ctx.stroke();ctx.setLineDash([]);}
  ctx.lineCap='round';
  for(const g of TRACKS){if(g[6]!==side)continue;const on=selNet&&g[5]===selNet,a=S(g[0],g[1]),b=S(g[2],g[3]);
   ctx.strokeStyle=on?SEL:TRK;ctx.globalAlpha=selNet&&!on?.35:.9;ctx.lineWidth=Math.max(1.5,g[4]*sc);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();}
  ctx.globalAlpha=1;
  for(const v of VIAS){const on=selNet&&v[3]===selNet,[X,Y]=S(v[0],v[1]);ctx.fillStyle=on?SEL:TRK;ctx.beginPath();ctx.arc(X,Y,Math.max(2*DPR(),v[2]*sc/2),0,7);ctx.fill();}}
 ctx.strokeStyle=EDGE;ctx.lineWidth=1.5*DPR();for(const o of OUTLINE){path(o);ctx.stroke();}
 if($('other').checked)for(const p of PARTS)if(p.side!==side)drawPart(p,true);
 for(const p of PARTS)if(p.side===side)drawPart(p,false);
 if(selVia){const[X,Y]=S(selVia[0],selVia[1]),r=Math.max(9*DPR(),selVia[2]*sc);   // marker: ring + crosshair
  ctx.strokeStyle=SEL;ctx.lineWidth=2*DPR();ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(X-r*1.8,Y);ctx.lineTo(X-r*1.2,Y);ctx.moveTo(X+r*1.2,Y);ctx.lineTo(X+r*1.8,Y);
  ctx.moveTo(X,Y-r*1.8);ctx.lineTo(X,Y-r*1.2);ctx.moveTo(X,Y+r*1.2);ctx.lineTo(X,Y+r*1.8);ctx.stroke();}
 const n=PARTS.filter(p=>p.side===side).length;
 const nu=PARTS.filter(p=>p.side===side&&unident(p)).length;
 $('cnt').textContent=(side==='F'?'top':'bottom')+': '+n+' parts'+(nu?' ('+nu+' unidentified)':'')+' · '+NETNAMES.length+' nets'+(hits.size?' · '+hits.size+' match':'')+(selNet?' · net '+selNet:'');}
function visible(p){return p.side===side||$('other').checked;}
function pick(X,Y){const[x,y]=W(X,Y);let best=null,ba=1e9;for(const p of PARTS){if(!visible(p))continue;const b=p.bbox;
 if(x>=b[0]-.1&&x<=b[2]+.1&&y>=b[1]-.1&&y<=b[3]+.1){const a=(b[2]-b[0])*(b[3]-b[1])+(p.side===side?0:1e6);if(a<ba){ba=a;best=p;}}}return best;}
function pickVia(X,Y){if(!$('trk').checked)return null;const[x,y]=W(X,Y),tol=4*DPR()/sc;let best=null,bd=1e9;
 for(const v of VIAS){const d=Math.hypot(x-v[0],y-v[1]);if(d<=Math.max(v[2]/2,2*DPR()/sc)+tol&&d<bd){bd=d;best=v;}}return best;}
function pickPad(X,Y){if(!$('pads').checked)return null;const[x,y]=W(X,Y);let best=null,bd=1e9;
 for(const p of PARTS){if(p.side!==side)continue;for(const q of p.pads){const d=Math.hypot(x-q[2],y-q[3]);if(d<=Math.max(q[4],q[5])/2+.05&&d<bd){bd=d;best=[p,q];}}}return best;}
const HINT='Click a part for details, or a pad or via to highlight its net.';
const HIDDEN_FIELDS=new Set(['KiLib_Generator']);   // tooling metadata, not useful to a reader
const head=(t,tag)=>'<div class="hd"><span class="ttl">'+t+'</span>'+(tag||'')+'<button class="x" data-close title="Close">×</button></div>';
const padRows=p=>{const seen=new Set(),R=[];   // one row per pad number+net; unnumbered pads only if on a net
 for(const q of p.pads){const k=q[0]+'\0'+q[7];if(!q[0]&&!q[7])continue;if(q[0]){if(seen.has(k))continue;seen.add(k);}R.push(q);}return R;};
const padName=n=>n?esc(n):'<i class="m">unnumbered</i>';
const netBtn=n=>'<button class="lnk" data-net="'+esc(n)+'">'+esc(n)+'</button>';
function show(p){sel=p;if(!p){$('info').textContent=HINT;draw();return;}
 const tag=unident(p)?'<span class="tag" title="Reference designator not yet identified">unidentified</span>':'';
 let h=head(esc(p.ref),tag);
 if(p.val&&p.val!==p.fp)h+='<div class="sub">'+esc(p.val)+'</div>';
 const src=Object.keys(p.fields).filter(k=>/^Source\d*$/.test(k)).sort((a,b)=>srcN(a)-srcN(b));
 h+='<dl><dt>Package</dt><dd>'+esc(p.fp)+'</dd><dt>Side</dt><dd>'+(p.side==='F'?'Top':'Bottom')+'</dd>';
 for(const k in p.fields)if(!src.includes(k)&&!HIDDEN_FIELDS.has(k))h+='<dt>'+esc(k)+'</dt><dd>'+fval(p.fields[k])+'</dd>';
 if(src.length)h+='<dt>Source'+(src.length>1?'s':'')+'</dt><dd>'+src.map(k=>fval(p.fields[k])).join('<br>')+'</dd>';
 h+='</dl>';
 const R=padRows(p);
 if(R.length){const cnt=L=>new Set(L.filter(q=>q[0]).map(q=>q[0])).size+L.filter(q=>!q[0]).length,   // unnumbered pads count individually
   n=cnt(R.filter(q=>q[7])),c=cnt(R);
  h+='<details'+(c<=8?' open':'')+'><summary>'+c+' pad'+(c>1?'s':'')+(n?' · '+n+' on a net':'')+'</summary><div class="grid">'+
   R.map(q=>'<span>'+padName(q[0])+'</span><span>'+(q[7]?netBtn(q[7]):'<span class="m">—</span>')+'</span>').join('')+'</div></details>';}
 h+='<div class="ft">'+p.x.toFixed(2)+', '+p.y.toFixed(2)+' mm · '+p.rot+'°</div>';
 $('info').innerHTML=h;draw();}
function showNet(n,p,q){selNet=n;sel=null;const G=new Map();   // part -> its pads on this net
 for(const r of PARTS)for(const t of r.pads)if(t[7]===n){if(!G.has(r))G.set(r,[]);if(!G.get(r).includes(t[0]))G.get(r).push(t[0]);}
 const pins=[...G.values()].reduce((a,b)=>a+b.length,0);
 let h=head(esc(n),'<span class="m">net</span>')+'<div class="sub m">'+pins+' pin'+(pins!==1?'s':'')+' on '+G.size+' part'+(G.size!==1?'s':'')+'</div>';
 if(p)h+='<dl><dt>Clicked</dt><dd>'+esc(p.ref)+' pad '+esc(q[0])+'</dd></dl>';
 h+='<details open><summary>Parts</summary><div class="grid">'+[...G].map(([r,L])=>'<span>'+esc(r.ref)+'</span><span>'+L.map(padName).join(', ')+'</span>').join('')+'</div></details>';
 $('info').innerHTML=h;draw();}
function showVia(v){selVia=v;sel=null;selNet=v[3]||null;
 const nv=v[3]?VIAS.filter(w=>w[3]===v[3]).length:1;
 let h=head('Via')+'<dl><dt>Net</dt><dd>'+(v[3]?netBtn(v[3]):'<span class="m">none</span>')+'</dd>'+
  (v[3]?'<dt>Vias on net</dt><dd>'+nv+'</dd>':'')+'<dt>Diameter</dt><dd>'+v[2]+' mm</dd></dl>'+
  '<div class="ft">'+v[0].toFixed(2)+', '+v[1].toFixed(2)+' mm · press F / Top–Bottom to flip; the via stays in place</div>';
 $('info').innerHTML=h;draw();}
$('info').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-close')){hits=new Set();selNet=null;selVia=null;show(null);}else if(b.dataset.net)showNet(b.dataset.net);};
function setSide(s){if(s===side)return;const at=selVia&&S(selVia[0],selVia[1])[0];
 side=s;$('sF').classList.toggle('on',s==='F');$('sB').classList.toggle('on',s==='B');
 if(selVia)ox=at-mir()*selVia[0]*sc;else fit();draw();}
$('sF').onclick=()=>setSide('F');$('sB').onclick=()=>setSide('B');
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='f'||e.key==='F')setSide(side==='F'?'B':'F');});
const ptr=new Map();let drag=null,pinch=null;
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptr.size===1)drag={x:e.clientX,y:e.clientY,ox,oy,m:false};else if(ptr.size===2){drag=null;const[a,b]=[...ptr.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),sc};}cv.style.cursor='grabbing';};
cv.onpointermove=e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(pinch&&ptr.size===2){const[a,b]=[...ptr.values()],mx=(a[0]+b[0])/2*DPR(),my=(a[1]+b[1])/2*DPR();zoomAt(mx,my,pinch.sc*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d/sc);return;}
 if(!drag)return;const dx=(e.clientX-drag.x)*DPR(),dy=(e.clientY-drag.y)*DPR();if(Math.abs(dx)+Math.abs(dy)>4)drag.m=true;ox=drag.ox+dx;oy=drag.oy+dy;draw();};
cv.onpointerup=cv.onpointercancel=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;
 if(drag&&!drag.m&&e.type==='pointerup'){const X=e.clientX*DPR(),Y=e.clientY*DPR(),pp=pickPad(X,Y);hits=new Set();
  selVia=null;let pv;
  if(pp&&pp[1][7])showNet(pp[1][7],pp[0],pp[1]);else if(pv=pickVia(X,Y))showVia(pv);else{selNet=null;show(pick(X,Y));}}
 drag=null;cv.style.cursor='grab';};
function zoomAt(X,Y,f){const ns=Math.max(.5,Math.min(400*DPR(),sc*f));ox=X-(X-ox)*ns/sc;oy=Y-(Y-oy)*ns/sc;sc=ns;draw();}
cv.onwheel=e=>{e.preventDefault();zoomAt(e.clientX*DPR(),e.clientY*DPR(),Math.exp(-e.deltaY*0.0015));};
cv.ondblclick=()=>{fit();draw();};
$('q').oninput=()=>{const t=$('q').value.trim().toLowerCase();hits=new Set();selNet=null;sel=null;selVia=null;
 const nm=NETNAMES.find(n=>n.toLowerCase()===t);if(nm){showNet(nm);return;}
 if(t)for(const p of PARTS)if(p.ref.toLowerCase().includes(t)||p.val.toLowerCase().includes(t))hits.add(p);
 if(hits.size&&![...hits].some(p=>p.side===side))setSide([...hits][0].side);
 if(hits.size===1){const p=[...hits][0];sc=Math.max(sc,25*DPR());ox=cv.width/2-mir()*p.x*sc;oy=cv.height/2-p.y*sc;show(p);}else draw();};
for(const id of['photo','op','pads','outl','labs','trk','other','unk'])if($(id))$(id).oninput=draw;   // photo controls are removed when there are no photos
$('mir').oninput=()=>{fit();draw();};
matchMedia('(prefers-color-scheme: light)').addEventListener('change',draw);
addEventListener('resize',()=>{size();fit();draw();});$('info').textContent=HINT;size();fit();draw();
</script></body></html>
